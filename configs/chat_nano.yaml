# Turn the pretrained FeatherLM Nano into a small chatbot (supervised fine-tuning on starter conversations).
#   python -m featherlm.data.chat_starter --out data/chat/starter
#   python finetune.py --config configs/chat_nano.yaml
model: {name: featherlm-nano-chat}
data:
  path: data/chat/starter
  format: jsonl
  train_file: data/chat/starter/train.jsonl
  val_file: data/chat/starter/val.jsonl
  seq_len: 192
training:
  seed: 0
  batch_size: 16
  grad_accum: 1
  max_steps: 900
  lr: 3.0e-4
  warmup_steps: 30
  min_lr_ratio: 0.1
  weight_decay: 0.05
  eval_interval: 150
  eval_batches: 10
  log_interval: 25
  save_interval: 150
  memory_budget_mb: 3000
finetune:
  init_from: runs/featherlm-nano/best
  mode: full
  set_chat_template: true
output_dir: runs/featherlm-nano-chat
