# Reverse proxy for FeatherLM (replace featherlm.example.com). TLS certificates via certbot:
#   sudo certbot --nginx -d featherlm.example.com
limit_req_zone $binary_remote_addr zone=featherlm:10m rate=5r/s;

server {
    listen 80;
    server_name featherlm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name featherlm.example.com;
    ssl_certificate     /etc/letsencrypt/live/featherlm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/featherlm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Never expose training/admin endpoints publicly (they are also disabled in the prod compose file).
    location ~ ^/(training|models/import|models/unload) { return 404; }
    location = /settings { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8000; }

    location / {
        limit_req zone=featherlm burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;            # needed for streaming (SSE) responses
        proxy_read_timeout 300s;
    }
}
