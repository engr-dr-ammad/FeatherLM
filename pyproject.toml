[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featherlm"
version = "0.1.0"
description = "FeatherLM: a hardware-efficient, CPU-trainable language model. Developed by Ammad Aslam with AI-assisted tooling."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ammad Aslam", email = "aamdm1@iscte-iul.pt"}]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4", "numpy>=1.26", "pyyaml>=6.0", "safetensors>=0.4", "psutil>=5.9",
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.6", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["featherlm*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
